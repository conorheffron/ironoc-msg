<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Client</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css" integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" crossorigin="anonymous">
    <link href="/main.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.1.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.1.1/bundles/stomp.umd.min.js"></script>
    <script src="/app.js"></script>
</head>
<body>
<noscript><h2 style="color: #ff0000">Seems your browser doesn't support Javascript! Websocket relies on Javascript being
    enabled. Please enable
    Javascript and reload this page!</h2></noscript>
<div id="main-content" class="container">
    <div class="row">
        <div class="col-md-6">
            <form class="form-inline">
                <div class="form-group">
                    <label for="connect">WebSocket connection:</label>
                    <input type="text" id="name" class="form-control" placeholder="Login ID here...">
                    <button id="connect" class="btn btn-default" type="submit">Connect</button>
                    <button id="registerSession" class="btn btn-default" type="submit">Register Session</button>
                    <button id="disconnect" class="btn btn-default" type="submit" disabled="disabled">Disconnect
                    </button>
                </div>
            </form>
        </div>
        <br /><br />
        <div class="col-md-6">
            <form class="form-inline">
                <div class="form-group">
                    <label for="name">Specific User Message</label><br />
                    <input type="text" id="username" class="form-control" placeholder="Your User ID here...">
                    <input type="text" id="targetName" class="form-control" placeholder="SEND to here...">
                    <input type="text" id="content" class="form-control" placeholder="Your Message here...">
                </div>
                <button id="sendToUser" class="btn btn-default" type="submit">Send</button>
            </form>
        </div>
    </div>
    <div class="row">
        <div class="col-md-12">
            <table id="conversation" class="table table-striped">
                <thead>
                    <tr>
                        <th>Greetings</th>
                        <th>Messages</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td id="greetings"></td>
                        <td id="messages"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
